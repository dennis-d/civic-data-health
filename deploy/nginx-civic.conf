# Civic Data Health nginx locations for the existing pagonya.co server.
# The deployed host uses civic.pagonya.co as the dedicated public endpoint.

server {
    listen 80;
    server_name civic.pagonya.co;
    return 301 https://civic.pagonya.co$request_uri;
}

server {
    listen 443 ssl;
    server_name civic.pagonya.co;

    ssl_certificate /etc/letsencrypt/live/civic.pagonya.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civic.pagonya.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200m;

    location = /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8787/mcp/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/civic-data-health;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

